<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Pikachu</title>
    <link
      rel="shortcut icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDr959xB5STvZ8HAULBPbxFmfmwMQeVBi9_7frc1iiug&s=10.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="bannerContainer">
      <!-- left side container yellow -->
      <div class="yelloLeftSide"></div>
      <!-- right side container light -->
      <div class="lightRightSide"></div>
      <div class="logo">Pokemone</div>
      <div class="miniHeading"><p>POKEMONE GEN |</p></div>
      <div class="bigHeading">Pikachu</div>
      <div class="description">
        Pikachu is an Electric-type Pokemon introduced in Generation I. Pikachu
        are small, chubby, and incredibly cute mouse-like Pokemon. They are
        almost completely covered by yellow fur.
      </div>
      <div class="pagination-line"></div>
      <div class="pagination pagination-number">01 / 08</div>
      <div class="pokeball">
        <div class="pokeball-line"></div>
        <div class="pokeball-center"></div>
      </div>
      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="mainLine">
        <div class="firstLine"></div>
        <div class="firstLine"></div>
        <div class="firstLine"></div>
        <img class="pikachu" src="./pokemone2.png" alt="">
      </div>
    </div>
  </body>
</html>
